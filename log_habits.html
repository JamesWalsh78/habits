<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Habits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Log Habits</h1>

  <form id="habitForm"><!-- Changed form to have an id for JS -->
    <!-- Date Field -->
    <label for="dateField">Date:</label>
    <input type="date" id="dateField" name="date" />
    <br /><br />

    <!-- Water Slider (0ml - 5L) -->
    <label for="waterSlider">Water (0ml - 5L):</label>
    <input type="range" id="waterSlider" name="water" min="0" max="5000" value="0" />
    <br /><br />

    <!-- Running Slider (0KM - 50KM) -->
    <label for="runningRange">Running (0KM - 50KM):</label>
    <input type="range" id="runningRange" name="running" min="0" max="50" value="0" />
    <br /><br />

    <!-- Gym Slider (0 - 100) -->
    <label for="gymSlider">Gym (0 - 100):</label>
    <input type="range" id="gymSlider" name="gym" min="0" max="100" value="0" />
    <br /><br />

    <!-- Reading Slider (0 - 100) -->
    <label for="readingSlider">Reading (0 - 100):</label>
    <input type="range" id="readingSlider" name="reading" min="0" max="100" value="0" />
    <br /><br />

    <!-- Friends Dropdown -->
    <label for="friendsDropdown">Friends:</label>
    <select id="friendsDropdown" name="friends">
      <!-- Values to be provided later -->
      <option value="">Select...</option>
    </select>
    <br /><br />

    <!-- Submit Button -->
    <button type="submit">Submit</button>
  </form>

  <!-- Link to the external JS file -->
  <script src="script.js"></script>
</body>
</html>
